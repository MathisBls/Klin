[package]
name = "mathisbls/klin"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

# Les dependances arrivent avec le premier jeu genere (Promise, ProfileStore...).
# On garde le fichier vide pour que `wally install` soit deja cablé dans le Makefile.
[dependencies]

# ProfileStore reste cote serveur : le client n'a aucune raison de voir la
# couche de persistance, et l'exposer en ReplicatedStorage donnerait a un
# exploit la carte de la structure des profils.
[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3"

[dev-dependencies]
